<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>E-Bidding PT PAL Indonesia</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1a2233;--mut:#5d6880;--line:#d6dce8;--pal:#1c3f95;--pal2:#12296b;--gr:#c4c8d0;--hot:#d9541e;--ok:#1b7f4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1420;--card:#171e2e;--ink:#e8ecf5;--mut:#9aa6bf;--line:#2b3550;--pal:#6f93f0;--pal2:#9db5f5;--gr:#3a4258;--hot:#ff8a55;--ok:#4cc58a;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1420;--card:#171e2e;--ink:#e8ecf5;--mut:#9aa6bf;--line:#2b3550;--pal:#6f93f0;--pal2:#9db5f5;--gr:#3a4258;--hot:#ff8a55;--ok:#4cc58a;color-scheme:dark}
*{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
header{background:#fff;border-bottom:4px solid #1c3f95;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
header img{height:48px;max-width:100%;display:block}
.ttl{font:700 20px 'Barlow Condensed',sans-serif;color:#12296b;letter-spacing:.02em;text-align:right}.ttl small{display:block;font:500 13px Barlow,sans-serif;color:#5d6880}
nav{display:flex;gap:4px;align-items:center;padding:0 20px;background:var(--pal2);flex-wrap:wrap}
nav button.t{background:none;border:0;color:#cfd8f3;padding:12px 16px;font:600 15px Barlow;cursor:pointer;border-bottom:3px solid transparent}
nav button.t.on{color:#fff;border-color:var(--hot)}nav .sp{flex:1}nav .who{color:#e3e9fb;font-size:14px;padding-right:8px}
main{max-width:1100px;margin:0 auto;padding:20px}
.btn{background:var(--pal);color:#fff;border:0;border-radius:6px;padding:9px 16px;font:600 15px Barlow;cursor:pointer}.btn:disabled{opacity:.5}
.btn.g{background:none;border:1px solid var(--line);color:var(--ink)}.btn.h{background:var(--hot);color:#fff}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.lot h3{margin:0 0 2px;font-size:18px}.lot .d{color:var(--mut);font-size:14px;margin:0 0 10px}
.price{font:700 32px 'Barlow Condensed',sans-serif;color:var(--pal)}.k{font-size:13px;color:var(--mut)}
.cd{font:700 20px 'Barlow Condensed';color:var(--hot)}.bd{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--mut)}
.bd.o{color:var(--ok);border-color:var(--ok)}.row{display:flex;gap:8px;align-items:center}.row>input{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600}
.wrap{overflow-x:auto}.auth{max-width:400px;margin:40px auto}.err{color:var(--hot);font-size:14px;min-height:20px}
.mod{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:20}
.mod .card{max-width:720px;width:100%}.ba{font-family:Georgia,serif;line-height:1.6}.ba h2{text-align:center;margin:0}.ba .c{text-align:center}
.sig{display:flex;justify-content:space-around;margin-top:40px;text-align:center}.sig div{width:40%}.sig i{display:block;height:60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}h2.s{margin:0;font:700 24px 'Barlow Condensed'}
</style></head><body>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Number(n).toLocaleString('id-ID'),fd=t=>new Date(t).toLocaleString('id-ID',{dateStyle:'long',timeStyle:'short'});
const S={me:null,lots:[],bids:[],txs:[],users:[],tab:'lelang',unsub:[],fin:new Set(),err:'',mode:'login'},D={};let db,dl;
const enc=new TextEncoder(),hex=u=>[...u].map(b=>b.toString(16).padStart(2,'0')).join('');
async function hashPw(pw,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);return hex(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(salt),iterations:150000},k,256)))}
const uid=s=>s.toLowerCase().replace(/[^a-z0-9_]/g,'');
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}};
const rows=s=>s.docs.map(d=>({id:d.id,...d.data()}));
async function init(){db=await claude.use('db');dl=await claude.use('downloads');
 if(!db){$('#app').innerHTML='<div class="card auth"><b>Database tidak tersedia.</b><p>Buka halaman ini dengan akun claude.ai yang memiliki akses ke artifact ini.</p></div>';return}
 const u=ss.get('pal_u');if(u){const d=await db.doc('users/'+u).get();if(d.exists){return start({id:u,...d.data()})}}
 render();setInterval(tick,1000)}
async function register(f){const u=uid(f.u),n=f.n.trim();
 if(u.length<3||!n||f.p.length<8)return S.err='Username min. 3 karakter (huruf/angka), nama wajib, kata sandi min. 8 karakter.';
 if(f.p!==f.p2)return S.err='Konfirmasi kata sandi tidak sama.';
 if((await db.doc('users/'+u).get()).exists)return S.err='Username sudah dipakai.';
 const first=(await db.collection('users').limit(1).get()).empty,salt=hex(crypto.getRandomValues(new Uint8Array(16)));
 const rec={name:n,role:first?'admin':'bidder',salt,hash:await hashPw(f.p,salt),created:Date.now()};
 await db.doc('users/'+u).set(rec);start({id:u,...rec})}
async function login(f){const u=uid(f.u),d=await db.doc('users/'+u).get();
 if(!d.exists||(await hashPw(f.p,d.data().salt))!==d.data().hash)return S.err='Username atau kata sandi salah.';
 start({id:u,...d.data()})}
function start(u){S.me=u;S.err='';ss.set('pal_u',u.id);S.tab='lelang';
 const sub=(q,k,fn)=>S.unsub.push(q.onSnapshot(s=>{S[k]=rows(s);if(fn)fn();render()},e=>console.error(e)));
 sub(db.collection('lots'),'lots',tick);sub(db.collection('bids').orderBy('ts','desc').limit(800),'bids');sub(db.collection('txs').orderBy('ts','desc'),'txs');
 if(u.role==='admin')sub(db.collection('users'),'users');render();if(!S.t)S.t=setInterval(tick,1000)}
function logout(){S.unsub.forEach(f=>f());S.unsub=[];S.me=null;S.lots=[];S.bids=[];S.txs=[];ss.set('pal_u',null);S.mode='login';render()}
const hi=id=>{const b=S.bids.filter(x=>x.lot===id);return b.reduce((m,x)=>!m||x.amount>m.amount||(x.amount===m.amount&&x.ts<m.ts)?x:m,null)};
function tick(){const now=Date.now();document.querySelectorAll('[data-end]').forEach(e=>{const r=+e.dataset.end-now;e.textContent=r<=0?'Berakhir':[Math.floor(r/36e5),Math.floor(r%36e5/6e4),Math.floor(r%6e4/1e3)].map(n=>String(n).padStart(2,'0')).join(':')});
 if(S.me)S.lots.filter(l=>l.status==='open'&&l.endsAt<=now&&!S.fin.has(l.id)).forEach(finalize)}
async function finalize(l){S.fin.add(l.id);try{const cur=await db.doc('lots/'+l.id).get();if(!cur.exists||cur.data().status!=='open')return;
 const bs=(await db.collection('bids').where('lot','==',l.id).get()).docs.map(d=>d.data()),w=bs.reduce((m,x)=>!m||x.amount>m.amount||(x.amount===m.amount&&x.ts<m.ts)?x:m,null);
 if(!w)return await db.doc('lots/'+l.id).update({status:'closed',winner:null});
 const no='BA/PAL/'+new Date(l.endsAt).getFullYear()+'/'+l.id.slice(0,5).toUpperCase();
 await db.doc('txs/'+l.id).set({lot:l.id,no,title:l.title,qty:l.qty,unit:l.unit,price:w.amount,buyer:w.user,buyerName:w.name,ts:l.endsAt,nBids:bs.length,nPeserta:new Set(bs.map(x=>x.user)).size,desc:l.desc||''});
 await db.doc('lots/'+l.id).update({status:'closed',winner:w.user,winnerName:w.name,price:w.amount})}catch(e){S.fin.delete(l.id);console.error(e)}}
async function bid(id){const l=S.lots.find(x=>x.id===id),v=Math.round(+D[id]);if(!l||l.status!=='open'||l.endsAt<=Date.now())return alert('Lelang sudah berakhir.');
 const bs=(await db.collection('bids').where('lot','==',id).get()).docs.map(d=>d.data().amount),top=bs.length?Math.max(...bs):0,min=top?top+l.inc:l.start;
 if(!(v>=min))return alert('Penawaran minimal '+rp(min));
 await db.collection('bids').doc().set({lot:id,user:S.me.id,name:S.me.name,amount:v,ts:Date.now()});D[id]=''}
async function addLot(f){const m=+f.dur;if(!f.title||!(+f.start>0)||!(+f.inc>0)||!(m>0))return alert('Lengkapi semua isian dengan benar.');
 await db.collection('lots').doc().set({title:f.title.trim(),desc:f.desc.trim(),qty:+f.qty,unit:f.unit.trim()||'kg',start:+f.start,inc:+f.inc,endsAt:Date.now()+m*6e4,status:'open',created:Date.now(),by:S.me.id});$('#modal').innerHTML=''}
const form=el=>Object.fromEntries([...el.querySelectorAll('[name]')].map(i=>[i.name,i.value]));
function baHTML(t){const bs=S.bids.filter(x=>x.lot===t.lot).sort((a,b)=>a.ts-b.ts);
 return `<div class="ba"><div class="c"><b>PT PAL INDONESIA (PERSERO)</b></div><h2>BERITA ACARA PELELANGAN</h2><div class="c">Nomor: ${esc(t.no)}</div><p>Pada ${esc(fd(t.ts))}, telah dilaksanakan pelelangan material sisa produksi melalui sistem e-bidding PT PAL Indonesia dengan rincian:</p>
 <table><tr><td>Material</td><td>${esc(t.title)}</td></tr><tr><td>Jumlah</td><td>${esc(t.qty)} ${esc(t.unit)}</td></tr><tr><td>Jumlah peserta / penawaran</td><td>${t.nPeserta} peserta / ${t.nBids} penawaran</td></tr><tr><td>Pemenang lelang</td><td><b>${esc(t.buyerName)}</b> (${esc(t.buyer)})</td></tr><tr><td>Harga penawaran tertinggi</td><td><b>${rp(t.price)}</b></td></tr></table>
 <p>Berdasarkan penawaran tertinggi yang sah, pemenang ditetapkan sebagaimana tersebut di atas. Berita acara ini dibuat secara elektronik dan menjadi dasar proses transaksi selanjutnya.</p>
 ${bs.length?`<p><b>Riwayat penawaran</b></p><table>${bs.map(b=>`<tr><td>${esc(new Date(b.ts).toLocaleTimeString('id-ID'))}</td><td>${esc(b.name)}</td><td>${rp(b.amount)}</td></tr>`).join('')}</table>`:''}
 <div class="sig"><div>Panitia Lelang<i></i>(................)</div><div>Pemenang Lelang<i></i>${esc(t.buyerName)}</div></div></div>`}
function showBA(id){const t=S.txs.find(x=>x.lot===id);if(!t)return;$('#modal').innerHTML=`<div class="mod"><div class="card"><div class="row" style="justify-content:flex-end;margin-bottom:8px"><button class="btn" data-a="dl" data-id="${id}">Unduh</button><button class="btn g" data-a="close">Tutup</button></div>${baHTML(t)}</div></div>`}
async function dlBA(id){const t=S.txs.find(x=>x.lot===id);if(!t||!dl)return alert('Unduhan tidak tersedia.');
 try{await dl.save({filename:'Berita-Acara-'+t.no.replace(/\//g,'-')+'.html',data:'<!DOCTYPE html><meta charset="utf-8"><title>'+esc(t.no)+'</title><style>body{max-width:720px;margin:30px auto;font-family:Georgia,serif}table{width:100%;border-collapse:collapse}td{padding:6px;border-bottom:1px solid #ccc}.c{text-align:center}.sig{display:flex;justify-content:space-around;margin-top:40px;text-align:center}.sig i{display:block;height:60px}</style>'+baHTML(t)})}catch(e){}}
function lotCard(l){const h=hi(l.id),admin=S.me.role==='admin',open=l.status==='open'&&l.endsAt>Date.now(),my=S.txs.find(x=>x.lot===l.id);
 const cur=h?h.amount:l.start;
 return `<div class="card lot"><div class="row" style="justify-content:space-between"><h3>${esc(l.title)}</h3><span class="bd ${open?'o':''}">${open?'Berlangsung':l.status==='cancelled'?'Dibatalkan':'Selesai'}</span></div>
 <p class="d">${esc(l.qty)} ${esc(l.unit)}${l.desc?' · '+esc(l.desc):''}</p>
 <div class="k">${h?'Penawaran tertinggi':'Harga awal'}</div><div class="price">${rp(cur)}</div>
 <div class="k">${h?esc(h.name)+' · ':''}${S.bids.filter(x=>x.lot===l.id).length} penawaran · kelipatan ${rp(l.inc)}</div>
 ${open?`<div class="k" style="margin-top:8px">Sisa waktu</div><div class="cd" data-end="${l.endsAt}"></div>
  ${admin?`<div class="row" style="margin-top:10px"><button class="btn g" data-a="end" data-id="${l.id}">Akhiri sekarang</button><button class="btn g" data-a="cancel" data-id="${l.id}">Batalkan</button></div>`:
  `<div class="row" style="margin-top:10px"><input id="b-${l.id}" type="number" inputmode="numeric" placeholder="Min. ${rp(h?h.amount+l.inc:l.start)}" value="${esc(D[l.id]||'')}" data-d="${l.id}"><button class="btn h" data-a="bid" data-id="${l.id}">Tawar</button></div>`}`:
 l.winner?`<p style="margin:10px 0 0">Pemenang: <b>${esc(l.winnerName)}</b>${l.winner===S.me.id?' <span class="bd o">Anda</span>':''}</p>${my&&(admin||l.winner===S.me.id)?`<button class="btn g" style="margin-top:8px" data-a="ba" data-id="${l.id}">Lihat Berita Acara</button>`:''}`:`<p class="k">${l.status==='cancelled'?'Lelang dibatalkan.':'Tidak ada penawaran.'}</p>`}</div>`}
function view(){const me=S.me,admin=me.role==='admin';
 if(S.tab==='lelang'){const ls=[...S.lots].sort((a,b)=>(b.status==='open')-(a.status==='open')||b.created-a.created);
  return `<div class="top"><h2 class="s">Lelang Material</h2>${admin?'<button class="btn" data-a="new">+ Lot Baru</button>':''}</div>${ls.length?`<div class="grid">${ls.map(lotCard).join('')}</div>`:`<div class="card">Belum ada lot lelang.${admin?' Klik “Lot Baru” untuk membuat lelang pertama.':' Silakan kembali lagi nanti.'}</div>`}`}
 const tx=admin?S.txs:S.txs.filter(t=>t.buyer===me.id),bs=(admin?S.bids:S.bids.filter(b=>b.user===me.id)).slice(0,50);
 return `<div class="top"><h2 class="s">Riwayat Transaksi</h2><span class="k">${admin?'Seluruh transaksi':'Lelang yang Anda menangkan'}</span></div>
 <div class="card wrap"><table><tr><th>No. BA</th><th>Tanggal</th><th>Material</th><th>Jumlah</th><th>Pemenang</th><th>Nilai</th><th></th></tr>${tx.map(t=>`<tr><td>${esc(t.no)}</td><td>${esc(fd(t.ts))}</td><td>${esc(t.title)}</td><td>${esc(t.qty)} ${esc(t.unit)}</td><td>${esc(t.buyerName)}</td><td><b>${rp(t.price)}</b></td><td><button class="btn g" data-a="ba" data-id="${t.lot}">Berita Acara</button></td></tr>`).join('')||'<tr><td colspan="7" class="k">Belum ada transaksi.</td></tr>'}</table></div>
 <div class="top" style="margin-top:24px"><h2 class="s">${admin?'Penawaran Terbaru':'Penawaran Saya'}</h2></div>
 <div class="card wrap"><table><tr><th>Waktu</th><th>Material</th>${admin?'<th>Peserta</th>':''}<th>Penawaran</th></tr>${bs.map(b=>`<tr><td>${esc(fd(b.ts))}</td><td>${esc((S.lots.find(l=>l.id===b.lot)||{}).title||'-')}</td>${admin?`<td>${esc(b.name)}</td>`:''}<td>${rp(b.amount)}</td></tr>`).join('')||'<tr><td colspan="4" class="k">Belum ada penawaran.</td></tr>'}</table></div>
 ${admin?`<div class="top" style="margin-top:24px"><h2 class="s">Pengguna Terdaftar</h2></div><div class="card wrap"><table><tr><th>Username</th><th>Nama</th><th>Peran</th></tr>${S.users.map(u=>`<tr><td>${esc(u.id)}</td><td>${esc(u.name)}</td><td>${u.role==='admin'?'Panitia (Admin)':'Peserta'}</td></tr>`).join('')}</table></div>`:''}`}
function render(){const a=document.activeElement,fid=a&&a.id,pos=a&&a.selectionStart;
 if(!S.me){$('#nav').innerHTML='';const L=S.mode==='login';$('#app').innerHTML=`<div class="card auth"><h2 class="s">${L?'Masuk':'Daftar Peserta Lelang'}</h2><div id="af"><label>Username</label><input name="u" id="au" autocomplete="username">${L?'':'<label>Nama lengkap / perusahaan</label><input name="n" id="an">'}<label>Kata sandi</label><input name="p" type="password" id="ap" autocomplete="${L?'current':'new'}-password">${L?'':'<label>Ulangi kata sandi</label><input name="p2" type="password" id="ap2">'}<p class="err">${esc(S.err)}</p><button class="btn" style="width:100%" data-a="${L?'login':'reg'}">${L?'Masuk':'Daftar'}</button></div><p class="k" style="text-align:center">${L?'Belum punya akun?':'Sudah punya akun?'} <a href="#" data-a="mode" style="color:var(--pal)">${L?'Daftar':'Masuk'}</a></p>${L?'':'<p class="k">Akun pertama yang terdaftar menjadi Panitia (Admin) lelang.</p>'}</div>`;return}
 $('#nav').innerHTML=`<button class="t ${S.tab==='lelang'?'on':''}" data-a="tab" data-id="lelang">Lelang</button><button class="t ${S.tab==='riwayat'?'on':''}" data-a="tab" data-id="riwayat">Riwayat Transaksi</button><span class="sp"></span><span class="who">${esc(S.me.name)} · ${S.me.role==='admin'?'Admin':'Peserta'}</span><button class="btn g" style="color:#fff;border-color:#8fa3d9" data-a="out">Keluar</button>`;
 $('#app').innerHTML=view();tick();if(fid){const e=document.getElementById(fid);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}}
document.addEventListener('input',e=>{if(e.target.dataset.d)D[e.target.dataset.d]=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('#af'))$('#af .btn').click();if(e.key==='Enter'&&e.target.dataset.d)bid(e.target.dataset.d)});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;e.preventDefault();const a=b.dataset.a,id=b.dataset.id;b.disabled=true;
 try{if(a==='mode'){S.mode=S.mode==='login'?'reg':'login';S.err=''}
 else if(a==='login'||a==='reg'){S.err='';await(a==='login'?login:register)(form($('#af')))}
 else if(a==='out')return logout();else if(a==='tab')S.tab=id;
 else if(a==='bid')await bid(id);else if(a==='ba')return showBA(id);else if(a==='dl')await dlBA(id);else if(a==='close')$('#modal').innerHTML='';
 else if(a==='end'&&confirm('Akhiri lelang ini sekarang?'))await db.doc('lots/'+id).update({endsAt:Date.now()});
 else if(a==='cancel'&&confirm('Batalkan lelang ini?'))await db.doc('lots/'+id).update({status:'cancelled'});
 else if(a==='new'){$('#modal').innerHTML=`<div class="mod"><div class="card" id="nf" style="max-width:460px"><h2 class="s">Lot Baru</h2><label>Nama material</label><input name="title"><label>Deskripsi</label><textarea name="desc" rows="2"></textarea><div class="row"><div style="flex:2"><label>Jumlah</label><input name="qty" type="number" value="1"></div><div style="flex:1"><label>Satuan</label><input name="unit" value="kg"></div></div><label>Harga awal (Rp)</label><input name="start" type="number"><label>Kelipatan penawaran (Rp)</label><input name="inc" type="number"><label>Durasi (menit)</label><input name="dur" type="number" value="60"><div class="row" style="margin-top:16px"><button class="btn" data-a="save">Mulai Lelang</button><button class="btn g" data-a="close">Batal</button></div></div></div>`;return}
 else if(a==='save'){await addLot(form($('#nf')))}}catch(x){console.error(x);alert('Terjadi kesalahan: '+(x.message||x))}
 b.disabled=false;render()});
init();
</script></body></html>
